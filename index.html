<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>pain.html 6言語版</title>

<style>

*{
box-sizing:border-box;
}

html,body{
height:100%;
margin:0;
overflow:hidden;
font-family:sans-serif;
background:#dfe5dd;
}

.app{

max-width:430px;
margin:0 auto;
height:100vh;

display:flex;
flex-direction:column;

background:#7abf64;

}

header{

background:#0b6a2f;
color:white;

text-align:center;

padding:14px;

font-size:24px;
font-weight:bold;

flex-shrink:0;

}

.langWrap{

background:#4e8b43;

padding:8px 6px;

display:grid;
grid-template-columns:repeat(6,1fr);

gap:4px;

flex-shrink:0;

}

.langBtn{

border:none;

border-radius:8px;

padding:8px 2px;

font-size:11px;

font-weight:bold;

background:#79a96c;

color:white;

cursor:pointer;

}

.langBtn.active{

background:white;
color:#0b6a2f;

}

.chatArea{

flex:1;

overflow-y:auto;

padding:12px 10px;

background:#8fcb74;

}

.secTitle{

text-align:center;

background:#ffffffcc;

padding:8px;

border-radius:10px;

margin:10px 0;

font-weight:bold;

font-size:16px;

color:#0b6a2f;

}

.row{

display:flex;

align-items:flex-end;

gap:6px;

margin:10px 0;

}

.left{

justify-content:flex-start;

}

.right{

justify-content:flex-end;

}

.avatar{

font-size:40px;

width:50px;

text-align:center;

}

.msg{

padding:10px 12px;

border-radius:18px;

line-height:1.45;

box-shadow:0 1px 3px rgba(0,0,0,.15);

}

.doctor{

background:white;

max-width:72%;

border-top-left-radius:4px;

}

.patient{

background:#d9fdd3;

max-width:68%;

margin-left:auto;

border-top-right-radius:4px;

}

.jp{

font-size:15px;

font-weight:700;

margin-bottom:6px;

}

.sub{

font-size:18px;

font-weight:800;

line-height:1.3;

margin-bottom:8px;

}

.audioRow{

display:flex;

gap:6px;

flex-wrap:wrap;

margin-top:6px;

}

.playBtn{

border:none;

background:#0b6a2f;

color:white;

padding:6px 10px;

border-radius:8px;

font-size:12px;

font-weight:bold;

cursor:pointer;

}

</style>

</head>

<body>

<div class="app">

<header>

いろいろな痛みの表現<br>

Expressions for various pain

</header>

<div class="langWrap">

<button class="langBtn active" onclick="setLang('off',this)">OFF</button>

<button class="langBtn" onclick="setLang('en',this)">EN</button>

<button class="langBtn" onclick="setLang('zh',this)">中文</button>

<button class="langBtn" onclick="setLang('pt',this)">PT</button>

<button class="langBtn" onclick="setLang('vi',this)">VI</button>

<button class="langBtn" onclick="setLang('fil',this)">FIL</button>

</div>

<div class="chatArea" id="chatArea"></div>

</div>

<script src="dialogue_new.js"></script>

<script>

let currentLang="off";

function setLang(lang,btn){

currentLang=lang;

document.querySelectorAll(".langBtn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

render();

}

function render(){

let html="";

data.forEach(sec=>{

html+=`<div class="secTitle">${sec.sectionTitle}</div>`;

sec.items.forEach(item=>{

let side=item.side;

let box=item.speaker==="doctor"?"doctor":"patient";

html+=`<div class="row ${side}">`;

if(side==="left"){

html+=`<div class="avatar">${item.icon}</div>`;

}

html+=`<div class="msg ${box}">`;

html+=`<div class="jp">${item.audio.jp}</div>`;

if(currentLang!=="off"){

html+=`<div class="sub">${item.audio[currentLang]}</div>`;

}

html+=`<div class="audioRow">

<button class="playBtn"

onclick="playAudio('jp','${item.id}')">

▶ JP

</button>`;

if(currentLang!=="off"){

html+=`<button class="playBtn"

onclick="playAudio('${currentLang}','${item.id}')">

▶ ${currentLang.toUpperCase()}

</button>`;

}

html+=`</div></div>`;

if(side==="right"){

html+=`<div class="avatar">${item.icon}</div>`;

}

html+=`</div>`;

});

});

document.getElementById("chatArea").innerHTML=html;

}

render();

let player=new Audio();

function playAudio(lang,id){

player.pause();

player=new Audio(`audio/${lang}/${id}.mp3`);

player.play();

}

</script>

</body>
</html>
